# Tuned down from -Xmx8G -XX:MaxMetaspaceSize=4G, which is what the Flutter
# template ships and what was failing here. On a machine with a couple of GB
# actually free, asking for an 8 GB heap does not fail cleanly: Gradle starts,
# the Kotlin daemon cannot get its allocation, and it dies mid-compile still
# holding the incremental cache files open. The error that surfaces is
# "Could not close incremental caches in .../compileReleaseKotlin", which reads
# like cache corruption and is really out-of-memory.
#
# 2 GB is comfortably enough to compile these three apps.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m

# Each worker is another JVM. Two is plenty and keeps the peak predictable.
org.gradle.workers.max=2

# Nothing to gain from incremental Kotlin compilation in a one-shot release
# build, and its cache is exactly what breaks when a daemon dies.
kotlin.incremental=false
kotlin.daemon.jvmargs=-Xmx1G

android.useAndroidX=true
android.enableJetifier=true
