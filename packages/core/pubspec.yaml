name: core
description: Shared domain models, API client, providers, and utilities for Paasel apps.
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

resolution: workspace

dependencies:
  dio: ^5.7.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  freezed_annotation: ^2.4.4
  geolocator: ^14.0.0
  json_annotation: ^4.9.0
  riverpod_annotation: ^2.6.1
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.9.0

dev_dependencies:
  build_runner: ^2.4.14
  flutter_test:
    sdk: flutter
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  mocktail: ^1.0.4
  riverpod_generator: ^2.6.3
  very_good_analysis: ^7.0.0

flutter:
  # ui_kit declares this too. Without it here, running tests from this package
  # makes it the primary pubspec and the icon font is excluded, which prints a
  # "found no fonts for MaterialIcons" warning on every run.
  uses-material-design: true
